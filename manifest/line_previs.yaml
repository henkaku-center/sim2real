# Pre-visualisation of the "Sesame makes Sesame" trailer, played in the line twin
# (manifest/line.yaml, layout tabletop-v1). Shots, timings and cuts follow the
# storyboard in the aps repository (trailer/storyboard.js).
#
# It is an animatic: scripted joint motion through inverse-kinematics waypoints,
# loose objects moved by hand-written paths, and the Sesame's stock walk played
# kinematically. No physics, grasping or soldering is simulated.
#
# camera: [look-at x, y, z, distance, azimuth, elevation]; the view moves from
# `from` to `to` over the shot. Azimuth 90 looks from the front of the table.
# Event times are seconds from the start of the shot. Points are target names
# from line.yaml or [x, y, z] in the line frame.
#
# Events
#   goto        arm moves its gripper through `points`
#   pick_place  arm carries `item` (a prop) from `pick` to `place`
#   prop        a loose object appears at the first point and moves through the rest
#   grow        a prop's box grows from `size_from` to `size_to` with its base at `at`
#   pallet      the kit pallet moves through `points`
#   sesame      one Sesame shows a pose, or walks from `path[0]` to `path[1]`

schema_version: 1
fps: 30
size: [1280, 720]
tilt_shift: true

