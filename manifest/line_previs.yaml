      - {type: goto, actor: assembly_arms, gripper: right, points: [jig_left], start: 0.6, end: 3.4}
      - {type: prop, name: toolhead, points: [[-0.60, 0.22, 0.20], [-0.44, 0.22, 0.20], [-0.60, 0.22, 0.20], [-0.44, 0.22, 0.20]], start: 0, end: 4}

