name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest = Apple Silicon, matching student machines
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- Python (uv) ---
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python env from lockfile
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest -v

      # --- Web (Vite + @mujoco/mujoco) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps from lockfile
        run: npm ci
        working-directory: web
      - name: Type-check and build web
        run: npm run build
        working-directory: web
