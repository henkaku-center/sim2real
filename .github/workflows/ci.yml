name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest = Apple Silicon, matching student machines
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # mesh assets (assets/mesh, web/public/meshes) are LFS objects

      # --- Web (Vite + @mujoco/mujoco) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps from lockfile
        run: npm ci
        working-directory: web
      - name: Type-check and build web
        run: npm run build
        working-directory: web

      # --- Python (uv) — includes the CDP browser smoke test, which needs
      # web/node_modules and the runner's system Chrome ---
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python env from lockfile
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest -v
        env:
          REQUIRE_BROWSER_TESTS: "1"

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-${{ matrix.os }}
          path: tests/artifacts/
          if-no-files-found: ignore
