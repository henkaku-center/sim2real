<!doctype html>
<html lang="ja" id="root">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>URASHIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* URASHIMA (the Sesame robot) at the café: black, with yamabuki (山吹色, the deep golden yellow of the kerria
   flower) for what you press and a lighter yellow for what is live. Text is warm white;
   learned pads come in six yellow-to-gold tones. Charts sit on dark cards. */
:root {
  --night: #000000; --night-2: #141414; --night-3: #2B2B2B; --ink: #000000;
  --white: #FFF8E1; --mist: #C9BE9C; --pink: #F8B500; --pink-deep: #A87A00;
  --yellow: #FFE135; --yamabuki: #F8B500;
  --f-yellow: #FFE135; --f-mint: #F8B500; --f-sky: #FFD166; --f-orange: #E6A100; --f-lilac: #FFF09A; --f-coral: #FFC233;
  --ok: #FFE135; --warn: #F8B500; --bad: #FF5A5A; --idle: #6B6352;
  /* chart neutrals on the dark cards */
  --grid: #2E2E2E; --axis: #555048; --muted: #A39C88; --line: #F8B500;
  /* Impact for Latin (Anton, its free look-alike, where Impact is missing: Android, some iPhones);
     Japanese has no glyphs in either and falls through to Dela Gothic One */
  --display: Impact, Anton, "Haettenschweiler", "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box }
html { background: var(--night); color: var(--white); -webkit-text-size-adjust: 100% }
body { margin: 0; font: 17px/1.55 var(--body); min-height: 100vh;
  background: radial-gradient(120% 55% at 50% 0%, #241A00 0%, var(--night) 62%) fixed }
.wrap { max-width: 720px; margin: 0 auto; padding: 14px 16px 80px }
button, input { font: inherit }
:focus-visible { outline: 3px solid var(--f-yellow); outline-offset: 3px }

/* top bar */
.top { display: flex; justify-content: flex-end }
.lang { background: transparent; color: var(--mist); border: 2px solid var(--night-3); border-radius: 999px;
  padding: 6px 14px; font-size: 15px; cursor: pointer }

/* hero: the wordmark and the talk button */
.hero { text-align: center; padding: 6px 0 4px }
.word { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 19vw, 104px); line-height: .95; letter-spacing: .01em;
  margin: 4px 0 2px; color: var(--yamabuki) }
.fmf { font-family: var(--display); font-size: clamp(18px, 5.4vw, 26px); letter-spacing: .14em; color: var(--yellow); margin: 0 0 8px }
.fmf span { color: var(--mist); margin: 0 .35em }
.tag { color: var(--mist); font-size: 17px; margin: 0 0 22px }
.mic { width: min(68vw, 260px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--yamabuki); color: #000; font-family: var(--display); font-size: clamp(24px, 7.5vw, 34px);
  line-height: 1.15; box-shadow: 0 10px 0 var(--pink-deep); transition: transform .08s, box-shadow .08s;
  position: relative; padding: 0 18px }
.mic:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--pink-deep) }
.mic.on::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 5px solid var(--yellow);
  animation: ring 1.2s ease-out infinite }
@keyframes ring { from { transform: scale(.92); opacity: 1 } to { transform: scale(1.18); opacity: 0 } }
.mic + .ear, .mic + .heard { margin-top: 26px }
.heard { font-family: var(--display); font-size: clamp(26px, 7vw, 38px); line-height: 1.25; min-height: 1.3em; margin: 18px 0 0;
  word-break: break-word; color: var(--yellow) }

/* the remote ear (a mic + foot pedal on the Pi): live under the talk button */
.ear { margin: 22px auto 0; max-width: 520px; padding: 14px 18px; border-radius: 20px; background: var(--night-2);
  border: 2px solid var(--night-3); text-align: left; display: grid; gap: 6px; transition: border-color .15s }
.ear[hidden] { display: none }
.ear .label { font-size: 15px; font-weight: 700; color: var(--mist) }
.ear .said { font-family: var(--display); font-size: clamp(22px, 6vw, 30px); line-height: 1.25; color: var(--yellow); word-break: break-word; min-height: 1.25em }
.ear .meter { height: 14px; border-radius: 999px; background: #000; overflow: hidden; border: 1px solid var(--night-3) }
.ear .meter i { display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--yamabuki), var(--yellow)); transition: width .12s linear }
.ear[data-s="listening"] { border-color: var(--yellow) }
.ear[data-s="thinking"] { border-color: var(--yamabuki) }
.ear[data-s="thinking"] .said::after { content: "…"; animation: blink 1s infinite }
.ear[data-s="dropped"] .said { color: var(--mist) }

/* what you just said, and the card it became: right under the talk button */
.mine { margin: 30px 0 0; text-align: left }
.mine[hidden] { display: none }
.mine .tagline { font-size: 15px; font-weight: 700; color: var(--mist); margin: 0 0 -6px 4px }
.mine .card { border: 2px solid var(--yamabuki) }
.mine .wait { margin-top: 10px; font-size: 17px; font-weight: 700; color: var(--yamabuki) }
.mine .wait::after { content: "…"; animation: blink 1s infinite }

/* status: big enough to read across the table */
.status { display: flex; align-items: center; gap: 14px; margin: 18px 0 6px; padding: 14px 18px; border-radius: 20px;
  background: var(--night-2); font-size: 20px; font-weight: 700; text-align: left }
.status .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 0 5px rgba(255,255,255,.08) }
.status[data-s="ok"] .dot { background: var(--ok) } .status[data-s="warn"] .dot { background: var(--warn) }
.status[data-s="bad"] .dot { background: var(--bad) } .status[data-s="busy"] .dot { background: var(--yamabuki); animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .35 } }
.status small { display: block; font-size: 16px; font-weight: 400; color: var(--mist) }
.type { display: flex; gap: 10px; margin-top: 16px }
.type input { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--night-3);
  background: var(--night); color: var(--white); font-size: 17px }
.type input::placeholder { color: var(--mist); opacity: .8 }
.type button { padding: 14px 20px; border-radius: 16px; border: 0; background: var(--yellow); color: #000; font-weight: 800; cursor: pointer }

/* pads */
h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 40px 0 6px }
.lead { color: var(--mist); margin: 0 0 14px; font-size: 16px }
.knobs { display: flex; flex-wrap: wrap; gap: 12px 26px; margin-bottom: 14px }
.knob { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700 }
.knob input { width: 150px; height: 28px; accent-color: var(--f-yellow) }
.knob output { min-width: 3em; font-variant-numeric: tabular-nums; color: var(--f-yellow) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.pad { min-height: 92px; border: 0; border-radius: 18px; padding: 12px 14px; text-align: left; cursor: pointer;
  color: #000; font-size: 17px; font-weight: 800; line-height: 1.3; display: flex; flex-direction: column;
  justify-content: space-between; gap: 6px; touch-action: manipulation; box-shadow: 0 6px 0 rgba(0,0,0,.28);
  transition: transform .07s, box-shadow .07s, filter .2s }
.pad small { font-size: 13px; font-weight: 600; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pad:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28) }
.pad.hit { filter: brightness(1.25) saturate(1.2) }
.pad.c0 { background: var(--f-yellow) } .pad.c1 { background: var(--f-mint) } .pad.c2 { background: var(--f-sky) }
.pad.c3 { background: var(--f-orange) } .pad.c4 { background: var(--f-lilac) } .pad.c5 { background: var(--f-coral) }
.pad.stock { background: transparent; color: var(--white); border: 2px solid var(--night-3); box-shadow: none; min-height: 72px; font-weight: 700 }
.pad.stock:hover { border-color: var(--yamabuki) }
.pad.stock.hit { background: var(--night-3); border-color: var(--yellow) }
.sub { font-size: 18px; font-weight: 700; margin: 26px 0 10px; color: var(--mist) }
.empty { color: var(--mist); font-size: 17px }

/* thought log: quiet dark cards */
.log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.live { color: var(--mist); font-size: 15px }
.card { background: var(--night-2); color: var(--white); border: 1px solid var(--night-3); border-radius: 18px; padding: 16px 18px; margin-top: 14px }
.card .said { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
.card .text { font-family: var(--display); font-size: 23px; line-height: 1.3; color: var(--yellow) }
.card .when { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums }
.steps { margin: 12px 0 0 6px; border-left: 3px solid var(--night-3); padding-left: 16px }
.step { position: relative; padding: 4px 0 10px }
.step::before { content: ""; position: absolute; left: -24px; top: 9px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--night-2); border: 3px solid var(--axis) }
.step.new::before { border-color: var(--yellow) } .step.reuse::before { border-color: var(--yamabuki) }
.step .what { font-size: 14px; font-weight: 800; color: var(--yamabuki) }
.step .what span { font-weight: 500; color: var(--muted); margin-left: 8px }
.choice { font-size: 19px; font-weight: 800; margin-top: 2px }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px }
.chip { background: var(--night-3); color: var(--white); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-variant-numeric: tabular-nums }
.why { margin-top: 6px; font-size: 16px; color: #E3D9BC }
.about { font-size: 18px; font-weight: 800 } .name { color: var(--muted); font-size: 14px; margin-left: 8px }
.err { color: #FF8A80; font-size: 15px; margin-top: 4px }
.chart { position: relative; margin-top: 8px }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart text { font-size: 12px; fill: var(--muted); font-family: var(--body) }
.chart .rowname { fill: var(--white); font-size: 13px; font-weight: 700 }
.tip { position: absolute; pointer-events: none; background: #000; color: var(--white); border: 1px solid var(--yamabuki); border-radius: 10px;
  padding: 6px 9px; font-size: 13px; display: none; white-space: nowrap; font-variant-numeric: tabular-nums }
.tip .t { color: var(--mist) }
details.table { margin-top: 6px; font-size: 14px; color: #E3D9BC }
details.table summary { cursor: pointer; color: var(--muted) }
details.table table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums }
details.table td, details.table th { padding: 2px 12px 2px 0; text-align: right; font-weight: 500 }
details.table th:first-child, details.table td:first-child { text-align: left }
@media (prefers-reduced-motion: reduce) { .mic.on::after, .status[data-s="busy"] .dot, .ear .said::after { animation: none } }
</style>
<body>
<div class="wrap">
  <div class="top"><button class="lang" id="other" type="button"></button></div>

  <section class="hero" data-t-aria="talk">
    <h1 class="word">URASHIMA</h1>
    <p class="fmf" aria-label="form, move, function">FORM<span>·</span>MOVE<span>·</span>FUNC</p>
    <p class="tag" data-t="tag"></p>
    <button class="mic" id="mic" type="button"></button>
    <div class="ear" id="ear" data-s="" hidden aria-live="polite">
      <span class="label" id="earLabel"></span><span class="said" id="earSaid"></span>
      <div class="meter" id="earMeter" hidden><i id="earLevel"></i></div></div>
    <p class="heard" id="now" aria-live="polite"></p>
    <div class="status" id="status" data-s="idle" aria-live="polite"><span class="dot"></span>
      <div><span id="statusText"></span><small id="hint"></small></div></div>
    <form class="type" id="say"><input id="text" maxlength="200" autocomplete="off" data-t-placeholder="placeholder"><button data-t="send"></button></form>
  </section>

  <section class="mine" id="mine" hidden aria-live="polite"><p class="tagline" data-t="mineLbl"></p><div id="mineCard"></div></section>

  <section class="pads" data-t-aria="padsTitle">
    <h2 data-t="padsTitle"></h2>
    <p class="lead" data-t="padNote"></p>
    <div class="knobs">
      <label class="knob"><span data-t="speedLbl"></span><input type="range" id="tempo" min="0.5" max="2" step="0.1" value="1"><output id="tempoV">×1</output></label>
      <label class="knob"><span data-t="sizeLbl"></span><input type="range" id="size" min="0" max="1" step="0.1" value="0.6"><output id="sizeV">0.6</output></label>
    </div>
    <div class="grid" id="learned"></div>
    <div class="sub" data-t="stockLbl"></div>
    <div class="grid" id="stock"></div>
  </section>

  <section>
    <div class="log-head"><h2 data-t="title"></h2><span class="live" id="live"></span></div>
    <p class="lead" data-t="flow"></p>
    <main id="list"></main>
  </section>
</div>
<script>
// Mounted under a path (tailscale serve /sesame): relative URLs need the trailing slash.
if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/thoughts'))
  location.replace(location.pathname + '/' + location.search);

// Language: one URL for both. The toggle remembers the choice on this phone; ?lang=en|ja
// still works for links; otherwise the browser's language. Speech recognition follows it,
// and the mind answers in the language it hears, so reasons and motion names match.
const asked = new URLSearchParams(location.search).get('lang');
let saved = null; try { saved = localStorage.getItem('sesame-lang') } catch (e) {}
const LANG = ['en', 'ja'].includes(asked) ? asked : ['en', 'ja'].includes(saved) ? saved
  : (navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en';
const STR = {
  ja: {
    talk: '話しかける', mic: '話しかける', listening: '聞いてるよ', keep: 'ずっと聞く', other: 'English',
    mineLbl: 'いま話したことと、ウラシマの頭の中', mineWait: '考え中',
    micOn: '聞いてるよ（押すと止まる）', recOn: '録音中（押すと送る）', srHint: 'もう一度押すと止まります',
    recHint: 'もう一度押すと送ります（20 秒まで）', recFallback: 'このブラウザの音声認識が使えないので、録音して送ります',
    transcribing: '文字にしています', noWhisper: '録音を文字にする準備ができていません。文字で送ってね', nothing: 'うまく聞き取れませんでした',
    ear: {listening: 'マイクで聞いてるよ（ペダルを離すと届きます）', thinking: '文字にしています', heard: 'マイクで聞こえたこと',
      dropped: 'うまく聞き取れませんでした', again: 'もう一度ペダルを踏んで話してね'},
    tag: '話しかけると、体で答えるロボット', placeholder: '文字でも話しかけられます', send: '送る',
    title: 'ウラシマの頭の中', flow: '聞こえたことを、どう考えて、どう動いたか', connecting: '接続中…', updated: '更新 ',
    empty: 'まだ何も聞いていません。話しかけてみてください。',
    st: {ok: '元気です', idle: '待っています', dry: '試しモード', offline: 'ロボットにつながりません', resetting: '電池が少ないかも',
      error: 'うまく動けませんでした', mind: 'ウラシマの頭につながりません', listening: '聞いています…', thinking: '考え中…',
      busy: 'ちょっと待ってね', done: '今日はおやすみ'},
    sub: {ok: 'さっき: ', idle: 'ボタンを押して話しかけてね', dry: 'ロボットには送っていません', offline: '電源と Wi-Fi を確認してください',
      resetting: '動くたびに再起動しています。バッテリーを充電してください', error: 'もう一度試してみてね', mind: 'Mac と mind が動いているか確認してください',
      listening: 'しゃべり終わると届きます', thinking: '動きを考えています', busy: s => `あと ${s} 秒`, done: 'たくさん話したので、また明日！'},
    slow: '通信が遅いようです。届いているかもしれません',
    https: '声で話すには https のアドレスで開いてください（文字なら送れます）',
    nosr: 'このブラウザは声を聞き取れません。文字で話しかけてね',
    allow: 'マイクを許可してください', misheard: e => `聞き取れませんでした（${e}）`,
    q: t => '「' + t + '」', noise: '（物音）', reflex: '反射', design: '振付', motion: '動き',
    candidates: n => `候補 ${n}`, strength: n => `大きさ ${n}`, speed: n => `速さ ×${n}`, addressed: n => `話しかけ ${n}%`,
    why: '理由', none: '何もしない', made: '新しく作った', stock: '内蔵の動き', reuse: '覚えた動きを再生',
    nochart: 'ロボットに入っている動き（グラフなし）', table: '数値で見る', keyend: 'キーの終わり', ease: '移り方',
    chart: '動きの時間変化', src: {chat: 'チャット', voice: '声', radio: 'ラジオ', sound: '物音', button: 'ボタン', pad: 'パッド'},
    padsTitle: 'パッド', speedLbl: '速さ', sizeLbl: '大きさ', stockLbl: 'ロボットに最初から入っている動き',
    padNote: '叩くとすぐ動きます。色つきはウラシマが自分で作った動き（新しい順）。速さと大きさは色つきの動きにかかります。',
    noLearned: 'まだありません。話しかけると増えていきます。', playing: n => `${n}！`,
    EASE: {linear: '等速', in: '溜め', out: '余韻', inout: 'なめらか'},
    AXIS: {surge: '前後振り', spread: '開き', yaw: 'ひねり', stride: '歩幅', height: '高さ', pitch: '前上がり', roll: '横傾き', lift: '足上げ'},
  },
  en: {
    talk: 'Talk', mic: 'Talk to me', listening: 'Listening', keep: 'Keep listening', other: '日本語',
    mineLbl: 'Just said, and inside Urashima’s head', mineWait: 'Thinking',
    micOn: 'Listening (tap to stop)', recOn: 'Recording (tap to send)', srHint: 'Tap again to stop',
    recHint: 'Tap again to send (up to 20 s)', recFallback: 'This browser can’t recognise speech, so it records and sends instead',
    transcribing: 'Writing it down', noWhisper: 'Recordings can’t be written down yet. Please type', nothing: 'Didn’t catch that',
    ear: {listening: 'Listening on the mic (let go of the pedal to send)', thinking: 'Writing it down', heard: 'Heard on the mic',
      dropped: 'Didn’t catch that', again: 'Press the pedal and try again'},
    tag: 'A robot that answers with its body', placeholder: 'Or type a message', send: 'Send',
    title: 'Inside Urashima’s head', flow: 'What it heard, how it thought, how it moved', connecting: 'Connecting…', updated: 'Updated ',
    empty: 'Nothing heard yet. Say something!',
    st: {ok: 'Feeling fine', idle: 'Waiting for you', dry: 'Practice mode', offline: 'Can’t reach the robot', resetting: 'Battery may be low',
      error: 'Couldn’t move', mind: 'Can’t reach Urashima’s brain', listening: 'Listening…', thinking: 'Thinking…',
      busy: 'Just a moment', done: 'Resting for today'},
    sub: {ok: 'Just now: ', idle: 'Press the button and talk', dry: 'Not sending to the robot', offline: 'Check its power and Wi-Fi',
      resetting: 'It restarts whenever it moves. Charge the battery', error: 'Give it another try', mind: 'Check that the Mac and the mind are running',
      listening: 'It goes through when you stop talking', thinking: 'Working out a movement', busy: s => `${s} s`, done: 'Lots of talking today. See you tomorrow!'},
    slow: 'The connection is slow. It may have arrived',
    https: 'Open the https address to use your voice (typing works here)',
    nosr: 'This browser can’t listen to speech. Please type instead',
    allow: 'Please allow the microphone', misheard: e => `Didn’t catch that (${e})`,
    q: t => '“' + t + '”', noise: '(a sound)', reflex: 'Reflex', design: 'Choreography', motion: 'Movement',
    candidates: n => `${n} choices`, strength: n => `size ${n}`, speed: n => `speed ×${n}`, addressed: n => `addressed ${n}%`,
    why: 'Why', none: 'Does nothing', made: 'Made a new movement', stock: 'Built-in movement', reuse: 'Replays a learned movement',
    nochart: 'Built into the robot (no chart)', table: 'Show numbers', keyend: 'Key ends', ease: 'Ease',
    chart: 'Movement over time', src: {chat: 'chat', voice: 'voice', radio: 'radio', sound: 'sound', button: 'button', pad: 'pad'},
    padsTitle: 'Pads', speedLbl: 'Speed', sizeLbl: 'Size', stockLbl: 'Built into the robot',
    padNote: 'Tap to play right away. Coloured pads are movements Urashima made itself, newest first. Speed and size apply to those.',
    noLearned: 'None yet. Talk to Urashima and it will make some.', playing: n => `${n}!`,
    EASE: {linear: 'steady', in: 'wind-up', out: 'settle', inout: 'smooth'},
    AXIS: {surge: 'sweep', spread: 'spread', yaw: 'twist', stride: 'stride', height: 'height', pitch: 'nose up', roll: 'tilt', lift: 'paw lift'},
  },
}[LANG];
const $ = id => document.getElementById(id);
$('root').lang = LANG;
document.querySelectorAll('[data-t]').forEach(el => el.textContent = STR[el.dataset.t]);
document.querySelectorAll('[data-t-placeholder]').forEach(el => el.placeholder = STR[el.dataset.tPlaceholder]);
document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', STR[el.dataset.tAria]));
$('other').textContent = STR.other;
$('other').onclick = () => {
  try { localStorage.setItem('sesame-lang', LANG === 'ja' ? 'en' : 'ja') } catch (e) {}
  location.replace(location.pathname);  // same URL, without ?lang
};
$('live').textContent = STR.connecting;
$('list').innerHTML = `<p class="empty">${STR.empty}</p>`;

// Units of the motion-space axes (manifest/motion_space.yaml); joints are in degrees.
const UNIT = {surge: '°', spread: '°', yaw: '°', stride: '°', height: 'mm', pitch: '°', roll: '°', lift: 'mm'};
const EASE = STR.EASE;
const label = n => STR.AXIS[n] || n, unit = n => UNIT[n] || '°';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toString();

// Status line: one place that says, in big type, what the robot is doing and what to do about it.
// Moments (listening, thinking, a wait) show for a while; otherwise the robot's health shows.
const MOOD = {ok: 'ok', idle: 'idle', dry: 'idle', offline: 'bad', resetting: 'warn', error: 'warn', mind: 'bad',
  listening: 'busy', thinking: 'busy', busy: 'warn', done: 'warn'};
let health = {robot: 'idle', doing: ''}, moment = null, momentUntil = 0;
const aboutOf = {};
function status(kind, sub, ms = 4000) { moment = {kind, sub}; momentUntil = Date.now() + ms; drawStatus() }
function drawStatus() {
  const m = moment && Date.now() < momentUntil ? moment : null;
  const kind = m ? m.kind : health.robot;
  let sub = m && m.sub != null ? m.sub : STR.sub[kind];
  if (!m && kind === 'ok') sub = STR.sub.idle;  // no "just now: <motion>": an old motion's name reads as an answer
  $('status').dataset.s = MOOD[kind] || 'idle';
  $('statusText').textContent = STR.st[kind] || kind;
  $('hint').textContent = typeof sub === 'string' ? sub : '';
}
setInterval(drawStatus, 1000);

function kindOf(e) {
  if (e.did === 'none' || !e.did) return ['none', STR.none];
  if (e.design) return ['new', STR.made];
  if (e.motion && e.motion.kind === 'firmware') return ['stock', STR.stock];
  return ['reuse', STR.reuse];
}

// Small multiples: one row per axis on a shared time scale; each row has its own scale and
// unit, so mixed units never share a y-axis. Key ends are hairlines labelled with their ease.
const G = {W: 680, L: 128, R: 12, top: 20, H: 46, gap: 10};
function chart(c, id) {
  const names = Object.keys(c.series), {W, L, R, top, H, gap} = G;
  const T = c.t[c.t.length - 1] || 1, x = t => L + (W - L - R) * t / T;
  const height = top + names.length * (H + gap) + 18;
  let svg = `<svg viewBox="0 0 ${W} ${height}" role="img" aria-label="${STR.chart}">`;
  let start = 0;
  for (const k of c.keys) {  // ease labels centred on each key's span
    svg += `<text x="${x((start + k.t) / 2)}" y="12" text-anchor="middle">${EASE[k.ease] || k.ease}</text>`;
    svg += `<line x1="${x(k.t)}" x2="${x(k.t)}" y1="16" y2="${height - 18}" stroke="var(--grid)" stroke-width="1"/>`;
    start = k.t;
  }
  names.forEach((n, i) => {
    const v = c.series[n], y0 = top + i * (H + gap);
    let lo = Math.min(0, ...v), hi = Math.max(0, ...v);
    if (hi - lo < 1e-6) { lo -= 1; hi += 1 }
    const y = val => y0 + H - (val - lo) / (hi - lo) * H;
    svg += `<text class="rowname" x="0" y="${y0 + H / 2 - 2}">${esc(label(n))}</text>`;
    svg += `<text x="0" y="${y0 + H / 2 + 14}">${esc(n)} ${unit(n)}</text>`;
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
    svg += `<text x="${L - 6}" y="${y0 + 9}" text-anchor="end">${fmt(hi)}</text>`;
    svg += `<text x="${L - 6}" y="${y0 + H}" text-anchor="end">${fmt(lo)}</text>`;
    const pts = v.map((val, j) => `${x(c.t[j]).toFixed(1)},${y(val).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg += `<circle class="dot" r="4" cx="0" cy="0" visibility="hidden" fill="var(--line)" stroke="#000" stroke-width="2"/>`;
  });
  svg += `<text x="${L}" y="${height - 2}">0 s</text><text x="${W - R}" y="${height - 2}" text-anchor="end">${fmt(T, 2)} s</text>`;
  svg += `<line class="cross" visibility="hidden" x1="0" x2="0" y1="16" y2="${height - 18}" stroke="var(--axis)" stroke-width="1"/>`;
  svg += `<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${height}" fill="transparent"/></svg>`;
  const rows = c.keys.map(k => {  // the table view: values where each key ends
    const j = c.t.findIndex(t => t >= k.t - 1e-9);
    return `<tr><td>${fmt(k.t, 2)} s</td><td>${EASE[k.ease] || k.ease}</td>${names.map(n => `<td>${fmt(c.series[n][j < 0 ? c.t.length - 1 : j])}</td>`).join('')}</tr>`;
  }).join('');
  const table = rows ? `<details class="table"><summary>${STR.table}</summary><table><tr><th>${STR.keyend}</th><th>${STR.ease}</th>${names.map(n => `<th>${esc(label(n))}</th>`).join('')}</tr>${rows}</table></details>` : '';
  return `<div class="chart" id="${id}">${svg}<div class="tip"></div></div>${table}`;
}

function hover(el, c) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), names = Object.keys(c.series);
  const {W, L, R, top, H, gap} = G, T = c.t[c.t.length - 1] || 1;
  const dots = [...svg.querySelectorAll('.dot')], cross = svg.querySelector('.cross');
  const move = ev => {
    const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    const j = Math.max(0, Math.min(c.t.length - 1, Math.round((q.x - L) / (W - L - R) * (c.t.length - 1))));
    const cx = L + (W - L - R) * c.t[j] / T;
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    names.forEach((n, i) => {
      const v = c.series[n], y0 = top + i * (H + gap);
      let lo = Math.min(0, ...v), hi = Math.max(0, ...v); if (hi - lo < 1e-6) { lo -= 1; hi += 1 }
      dots[i].setAttribute('cx', cx); dots[i].setAttribute('cy', y0 + H - (v[j] - lo) / (hi - lo) * H);
      dots[i].setAttribute('visibility', 'visible');
    });
    tip.innerHTML = `<div class="t">${fmt(c.t[j], 2)} s</div>` + names.map(n => `${esc(label(n))} <b>${fmt(c.series[n][j])}</b> ${unit(n)}`).join('<br>');
    const box = el.getBoundingClientRect(), left = (cx / W) * box.width;
    tip.style.display = 'block';
    tip.style.left = Math.min(box.width - tip.offsetWidth, left + 12) + 'px'; tip.style.top = '18px';
  };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; [cross, ...dots].forEach(d => d.setAttribute('visibility', 'hidden')) });
}

function card(e, i) {
  const time = new Date(e.t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const m = e.motion || {};
  const chips = [STR.strength(fmt(e.intensity, 2))];
  if (e.tempo && e.tempo !== 1) chips.push(STR.speed(fmt(e.tempo)));
  if (e.source === 'button' || e.source === 'pad') {
    return `<article class="card"><div class="said"><span class="text">${esc(m.about || e.did)}</span>
      <span class="when">${time}, ${STR.src[e.source]}</span></div>
      ${m.curve ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>` + chart(m.curve, 'c' + i) : ''}</article>`;
  }
  const [k, said] = kindOf(e);
  if (e.addressed != null) chips.push(STR.addressed(Math.round(e.addressed * 100)));
  let html = `<article class="card"><div class="said"><span class="text">${e.text ? STR.q(esc(e.text)) : STR.noise}</span>
    <span class="when">${time}, ${STR.src[e.source] || esc(e.source)}</span></div><div class="steps">
    <div class="step ${k}"><div class="what">${STR.reflex}<span>${esc(e.by)} ${fmt(e.reflex_ms / 1000)} s${e.considered ? ', ' + STR.candidates(e.considered) : ''}</span></div>
    <div class="choice">${said}</div><div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>
    ${e.why ? `<div class="why">${STR.why}: ${esc(e.why)}</div>` : ''}${e.note && !e.design ? `<div class="err">${esc(e.note)}</div>` : ''}</div>`;
  if (e.design) html += `<div class="step new"><div class="what">${STR.design}<span>${esc(e.design.by)} ${fmt(e.design.ms / 1000)} s</span></div>
    ${e.design.why ? `<div class="why">${STR.why}: ${esc(e.design.why)}</div>` : ''}</div>`;
  if (e.motion) {
    html += `<div class="step ${k}"><div class="what">${STR.motion}</div><div><span class="about">${esc(m.about)}</span><span class="name">${esc(m.name)}</span></div>`;
    html += m.curve ? chart(m.curve, 'c' + i) : `<div class="why">${STR.nochart}</div>`;
    html += `</div>`;
  }
  return html + `</div></article>`;
}

// Poll a few bytes; fetch the whole log (gzip) only when it changed. Phones on mobile data
// reach this through the Funnel relay, where re-sending 200 kB every 2 s clogs the line.
let shown = '', busy = false;
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const v = await (await fetch('latest', {signal: AbortSignal.timeout(8000)})).json();
    health = {robot: v.robot || 'idle', doing: v.doing || ''}; drawStatus(); drawEar(v.ear);
    $('live').textContent = STR.updated + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    const key = v.n + ':' + v.t;
    if (key === shown) return;
    const list = await (await fetch('trace', {signal: AbortSignal.timeout(20000)})).json();
    shown = key;
    loadPads().catch(() => {});
    const items = list.slice().reverse();
    $('list').innerHTML = items.length ? items.map(card).join('') : `<p class="empty">${STR.empty}</p>`;
    items.forEach((e, i) => { if (e.motion && e.motion.curve) hover($('c' + i), e.motion.curve) });
    lastItems = items; drawMine();
    if (moment && moment.kind === 'thinking') momentUntil = 0;  // the answer arrived
  } catch (err) {
    health = {robot: 'mind', doing: ''}; drawStatus();
  } finally { busy = false }
}
// One card above the pads: the newest thing anyone said (page, pedal mic) and what it became.
// Something just sent shows at once with "thinking" until its card arrives, matched by text
// and the mind's own clock (the reply to /say or /hear, or the ear's report), so an older
// card never stands in for it. Pad presses are not speech and never show here.
let mine = null, lastItems = [];
function said(text, t) { mine = {text: text.trim().slice(0, 200), t, at: Date.now()}; now.textContent = ''; drawMine() }
const spoken = x => x.text && x.source !== 'pad' && x.source !== 'button';
function drawMine() {
  if (mine && Date.now() - mine.at > 30000) mine = null;  // it never became a card: stop waiting
  let e = mine ? lastItems.find(x => x.text === mine.text && x.t >= mine.t - 1) : null;
  if (e || !mine) { mine = null; e = e || lastItems.find(spoken) }
  if (!e && !mine) { $('mine').hidden = true; return }
  $('mine').hidden = false;
  if (!e) {
    $('mineCard').dataset.key = '';
    $('mineCard').innerHTML = `<article class="card"><div class="said"><span class="text">${STR.q(esc(mine.text))}</span></div>
      <div class="wait">${STR.mineWait}</div></article>`;
    return;
  }
  if ($('mineCard').dataset.key === e.t + e.text) return;
  $('mineCard').dataset.key = e.t + e.text;
  $('mineCard').innerHTML = card(e, 'mine');
  if (e.motion && e.motion.curve) hover($('cmine'), e.motion.curve);
}

// The remote ear: what the mic by the robot is hearing, right under the talk button.
// While someone holds the pedal the page polls fast so the meter and the words keep up.
let earBusy = false, earSeen = 0;
function drawEar(e) {
  const box = $('ear');
  earBusy = !!e && (e.s === 'listening' || e.s === 'thinking') && Date.now() / 1000 - e.t < 8;
  if (e && e.s === 'heard') {  // the words move into the card below; the panel's job is done
    if (e.t !== earSeen) { earSeen = e.t; said(e.text, e.t); shown = ''; status('thinking', null, 20000) }
    box.hidden = true; box.dataset.s = ''; return;
  }
  if (!e || Date.now() / 1000 - e.t > (e.s === 'heard' ? 20 : 8)) { box.hidden = true; box.dataset.s = ''; return }
  box.hidden = false; box.dataset.s = e.s;
  $('earLabel').textContent = STR.ear[e.s] || '';
  $('earMeter').hidden = e.s !== 'listening';
  $('earLevel').style.width = Math.round((e.level || 0) * 100) + '%';
  $('earSaid').textContent = e.s === 'dropped' ? STR.ear.again : '';
}
async function loop() { await refresh(); setTimeout(loop, earBusy || listening ? 300 : 1500) }
loop();

// Talking: the browser's speech recognition (needs HTTPS or localhost) turns speech into
// text; the text goes to the mind like a chat line. Typing works everywhere.
const now = $('now'), mic = $('mic');
function refused(r, j) {  // 429 from the 4 s / daily gate
  return j.done_for_today ? status('done', null, 8000) : status('busy', STR.sub.busy(Math.ceil(j.wait_s)), 3000);
}
async function send(text) {
  text = text.trim(); if (!text) return;
  now.textContent = STR.q(text);
  try {
    const r = await fetch('say', {method: 'POST', body: text, signal: AbortSignal.timeout(15000)});
    if (r.status === 429) return refused(r, await r.json());
    if (!r.ok) return status('error', null);
    const j = await r.json().catch(() => ({}));
    said(text, j.t || 0);
    status('thinking', null, 20000); shown = ''; setTimeout(refresh, 1500); setTimeout(refresh, 4000);
  } catch (e) { status('mind', e.name === 'TimeoutError' ? STR.slow : null, 6000) }
}
$('say').onsubmit = e => { e.preventDefault(); send($('text').value); $('text').value = '' };

// The talk button: tap to start, tap again to stop. Two ways to listen:
//  sr  - the browser's speech recognition (Chrome, Safari, phones). It ends by itself after
//        each phrase or a silence, so it is restarted until the button is tapped again
//        (and after 60 s without words). This is what used to stop "right away" on a PC.
//  rec - record here and let the mind's whisper write it down (POST /hear). Used where
//        recognition is missing or broken (Firefox; Vivaldi, Brave and other Chromium builds
//        without Google's speech service answer "network" at once).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let mode = SR ? 'sr' : 'rec', listening = false, rec = null, heardAt = 0, quickEnds = 0;
if (!window.isSecureContext || (!SR && !canRecord)) {
  mic.disabled = true; mic.style.opacity = .45;
  $('text').placeholder = window.isSecureContext ? STR.nosr : STR.https;
}
function draw() {
  mic.classList.toggle('on', listening);
  mic.textContent = listening ? (mode === 'rec' ? STR.recOn : STR.micOn) : STR.mic;
}
function stopListening() { listening = false; momentUntil = 0; drawStatus(); draw() }
function toRecording() {
  mode = 'rec'; if (rec) { rec.onend = null; try { rec.abort() } catch (e) {} }
  status('listening', STR.recFallback, 6000); recStart();
}
function srStart() {
  const started = Date.now();
  rec = new SR(); rec.lang = LANG === 'ja' ? 'ja-JP' : 'en-US'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    const r = e.results[e.results.length - 1], t = r[0].transcript;
    heardAt = Date.now(); quickEnds = 0; now.textContent = STR.q(t);
    if (r.isFinal) send(t);
  };
  rec.onerror = e => {
    if (['network', 'service-not-allowed', 'language-not-supported'].includes(e.error) && canRecord) return toRecording();
    if (['not-allowed', 'audio-capture', 'service-not-allowed'].includes(e.error)) {
      rec.onend = null; stopListening(); status('error', STR.allow, 6000);
    }  // no-speech, aborted: onend starts again
  };
  rec.onend = () => {
    if (!listening || mode !== 'sr') return draw();
    if (Date.now() - heardAt > 60000) return stopListening();
    // a recogniser that keeps ending at once without hearing anything does not work here
    quickEnds = Date.now() - started < 1000 ? quickEnds + 1 : 0;
    if (quickEnds >= 3 && canRecord) return toRecording();
    setTimeout(() => { if (listening && mode === 'sr') try { srStart() } catch (e) { stopListening() } }, 250);
  };
  rec.start();
}
let media = null, stream = null, chunks = [], recTimer = 0;
async function recStart() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
  } catch (e) { stopListening(); return status('error', STR.allow, 6000) }
  if (!listening) { stream.getTracks().forEach(t => t.stop()); return }
  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  media = new MediaRecorder(stream, type ? {mimeType: type} : {}); chunks = [];
  media.ondataavailable = e => { if (e.data.size) chunks.push(e.data) };
  media.onstop = upload;
  media.start(); draw(); status('listening', STR.recHint, 21000);
  recTimer = setTimeout(() => { if (listening && mode === 'rec') recStop() }, 20000);
}
function recStop() {
  clearTimeout(recTimer); listening = false; draw();
  if (media && media.state !== 'inactive') media.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
}
async function upload() {
  const blob = new Blob(chunks, {type: (media && media.mimeType) || 'audio/webm'});
  if (blob.size < 1500) return stopListening();
  status('thinking', STR.transcribing, 30000);
  try {
    const r = await fetch('hear?lang=' + LANG, {method: 'POST', body: blob, headers: {'Content-Type': blob.type},
      signal: AbortSignal.timeout(40000)});
    if (r.status === 429) return refused(r, await r.json());
    if (r.status === 503) return status('error', STR.noWhisper, 8000);
    if (!r.ok) return status('error', null);
    const j = await r.json();
    if (!j.text) return status('error', STR.nothing, 5000);
    said(j.text, j.t || 0);
    status('thinking', null, 20000); shown = ''; setTimeout(refresh, 1500); setTimeout(refresh, 4000);
  } catch (e) { status('mind', e.name === 'TimeoutError' ? STR.slow : null, 6000) }
}
draw();
mic.onclick = () => {
  if (listening) {
    if (mode === 'rec') return recStop();
    listening = false; if (rec) try { rec.stop() } catch (e) {}
    return stopListening();
  }
  listening = true; heardAt = Date.now(); quickEnds = 0; draw();
  if (mode === 'sr') { status('listening', STR.srHint, 60000); try { srStart() } catch (e) { canRecord ? toRecording() : stopListening() } }
  else recStart();
};

// Pads: every motion the robot knows, played at once (no model call), like a DJ's pads.
// A pad keeps its colour (from its name) wherever it moves in the list.
const tempoIn = $('tempo'), sizeIn = $('size');
const knobs = () => { $('tempoV').textContent = '×' + fmt(+tempoIn.value); $('sizeV').textContent = fmt(+sizeIn.value) };
tempoIn.oninput = sizeIn.oninput = knobs; knobs();
const hue = name => [...name].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7) % 6;
let padKey = '';
async function loadPads() {
  const list = await (await fetch('motions', {signal: AbortSignal.timeout(15000)})).json();
  list.forEach(m => aboutOf[m.name] = m.stock && LANG !== 'ja' ? m.name : m.about);
  const key = list.map(m => m.name).join(',');
  if (key === padKey) return;
  padKey = key;
  const pad = m => `<button class="pad ${m.stock ? 'stock' : 'c' + hue(m.name)}" type="button" data-name="${esc(m.name)}">
    ${esc(aboutOf[m.name])}<small>${esc(m.name)}</small></button>`;
  const learned = list.filter(m => !m.stock);
  $('learned').innerHTML = learned.length ? learned.map(pad).join('') : `<p class="empty">${STR.noLearned}</p>`;
  $('stock').innerHTML = list.filter(m => m.stock).map(pad).join('');
  drawStatus();
}
document.querySelector('.pads').addEventListener('click', async ev => {
  const b = ev.target.closest('.pad'); if (!b) return;
  b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 350);
  try {
    const r = await fetch('play', {method: 'POST', signal: AbortSignal.timeout(15000),
      body: JSON.stringify({name: b.dataset.name, tempo: +tempoIn.value, intensity: +sizeIn.value})});
    if (r.ok) { shown = ''; setTimeout(refresh, 800) }
  } catch (e) { status('mind', e.name === 'TimeoutError' ? STR.slow : null, 6000) }
});
loadPads().catch(() => {});
</script>
</body>
</html>
