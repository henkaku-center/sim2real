<!doctype html>
<html lang="ja" id="root">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>セサミの思考ログ</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --new: #eb6834; --reuse: #1baf7a; --none: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --new: #d95926; --reuse: #199e70; --none: #898781;
  }
}
* { box-sizing: border-box }
body { margin: 0 }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh;
  font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; padding: 20px 16px 60px }
header { max-width: 760px; margin: 0 auto 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
h1 { font-size: 20px; margin: 0; font-weight: 650 }
header .sub { color: var(--text-secondary); font-size: 13px }
header .live { margin-left: auto; color: var(--muted); font-size: 12px }
main { max-width: 760px; margin: 0 auto }
.card { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px 12px; margin-bottom: 14px }
.heard { display: flex; align-items: baseline; gap: 10px }
.heard .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }
.heard .text { font-size: 18px; font-weight: 600 }
.heard .src { color: var(--muted); font-size: 12px }
.steps { margin: 10px 0 0 6px; border-left: 1px solid var(--axis); padding-left: 16px }
.step { position: relative; padding: 4px 0 8px }
.step::before { content: ""; position: absolute; left: -21px; top: 11px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--surface-1); border: 2px solid var(--axis) }
.step.new::before { border-color: var(--new) } .step.reuse::before { border-color: var(--reuse) }
.label { color: var(--muted); font-size: 12px; letter-spacing: .02em }
.label b { color: var(--text-secondary); font-weight: 600 }
.choice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 2px }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.meta { color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums }
.why { color: var(--text-secondary); margin-top: 2px }
.why::before { content: var(--why, "理由　"); color: var(--muted); font-size: 12px }
.about { font-weight: 600 } .name { color: var(--muted); font-size: 12px; margin-left: 6px }
.chart { position: relative; margin-top: 6px }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart text { font-size: 11px; fill: var(--muted) }
.chart .rowname { fill: var(--text-secondary); font-size: 12px }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--ring);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: none;
  white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-primary) }
.tip .t { color: var(--muted) }
details.table { margin-top: 4px; font-size: 12px; color: var(--text-secondary) }
details.table summary { cursor: pointer; color: var(--muted) }
details.table table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums }
details.table td, details.table th { padding: 2px 10px 2px 0; text-align: right; font-weight: 400 }
details.table th:first-child, details.table td:first-child { text-align: left }
.empty { color: var(--muted); text-align: center; padding: 40px 0 }
.err { color: var(--text-secondary); font-size: 13px }
.talk { max-width: 760px; margin: 0 auto 18px; background: var(--surface-1); border: 1px solid var(--ring);
  border-radius: 16px; padding: 16px }
.talk .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.mic { font: inherit; font-size: 18px; font-weight: 650; padding: 14px 22px; border-radius: 999px; border: 0;
  background: var(--series-1); color: #fff; cursor: pointer; min-width: 12em }
.mic.on { background: var(--new) }
.keep { color: var(--text-secondary); font-size: 14px; display: inline-flex; gap: 6px; align-items: center }
.talk form { display: flex; gap: 8px; margin-top: 12px }
.talk input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ring);
  background: var(--page); color: var(--text-primary) }
.talk form button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--ring);
  background: var(--page); color: var(--text-primary) }
.now { margin-top: 10px; min-height: 1.5em; font-size: 20px; font-weight: 600 }
.hint { color: var(--muted); font-size: 13px }
.lang { font-size: 13px; color: var(--text-secondary) } .lang a { color: inherit }
</style>
<body>
<div class="viz-root">
<section class="talk" data-t-aria="talk">
  <div class="row">
    <button class="mic" id="mic" type="button"></button>
    <label class="keep"><input type="checkbox" id="keep"> <span data-t="keep"></span></label>
    <span class="lang" style="margin-left:auto"><a id="other" href="#"></a></span>
  </div>
  <div class="now" id="now"></div>
  <div class="hint" id="hint" data-t="hint"></div>
  <form id="say"><input id="text" maxlength="200" autocomplete="off" data-t-placeholder="placeholder"><button data-t="send"></button></form>
</section>
<header>
  <h1 data-t="title"></h1>
  <span class="sub" data-t="flow"></span>
  <span class="live" id="live"></span>
</header>
<main id="list"></main>
</div>
<script>
// Mounted under a path (tailscale serve /sesame): relative URLs need the trailing slash.
if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/thoughts'))
  location.replace(location.pathname + '/' + location.search);

// Language: ?lang=en|ja, else the browser's. Speech recognition follows it, and the mind
// answers in the language it hears, so reasons and motion names read the same way.
const asked = new URLSearchParams(location.search).get('lang');
const LANG = asked === 'en' || asked === 'ja' ? asked : (navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en';
const STR = {
  ja: {
    talk: '話しかける', mic: '🎤 話しかける', listening: '● 聞いています', keep: 'ずっと聞く', other: 'English',
    hint: 'ボタンを押してセサミに話しかけてね。言葉の気持ちに合う動きを考えて、体で答えます。',
    placeholder: '文字でも話しかけられます', send: '送る', title: 'セサミの思考ログ',
    flow: '聞こえたこと → 反射の判断 → 振付 → 動き', connecting: '接続中…', updated: '更新 ',
    offline: 'mind に接続できません', empty: 'まだ何も聞いていません。話しかけてみてください。',
    sent: 'とどいたよ。考え中…', failed: 'うまく送れませんでした', unreachable: 'セサミの頭（PC）につながりません',
    wait: s => `ちょっと待ってね（あと ${s} 秒）`, done: '今日はたくさん話したので、セサミはおやすみです。また明日！',
    https: '声で話すには https のアドレスで開いてください。文字なら送れます。',
    nosr: 'このブラウザは声の聞き取りに対応していません。文字で話しかけてね。',
    allow: 'マイクを許可してください', misheard: e => `聞き取れませんでした（${e}）`, hearing: '聞いています…',
    q: t => '「' + t + '」', noise: '（物音）', reflex: '反射', design: '振付', motion: '動き',
    candidates: '候補', strength: '強さ', speed: '速さ', addressed: '話しかけ', why: '理由',
    none: '何もしない', made: '新しく作った', stock: '内蔵の動き', reuse: '覚えた動きを再生',
    nochart: 'ロボットに入っている動き（グラフなし）', table: '数値で見る', keyend: 'キーの終わり', ease: '移り方',
    chart: '動きの時間変化', src: {chat: 'チャット', voice: '声', radio: 'ラジオ', sound: '物音'},
    EASE: {linear: '等速', in: '溜め', out: '余韻', inout: 'なめらか'},
    AXIS: {surge: '前後振り', spread: '開き', yaw: 'ひねり', stride: '歩幅', height: '高さ', pitch: '前上がり', roll: '横傾き', lift: '足上げ'},
  },
  en: {
    talk: 'Talk', mic: '🎤 Talk to Sesame', listening: '● Listening', keep: 'Keep listening', other: '日本語',
    hint: 'Press the button and talk to Sesame. It thinks of a movement that fits what you said and answers with its body.',
    placeholder: 'Or type a message', send: 'Send', title: 'Sesame’s thoughts',
    flow: 'what it heard → reflex → choreography → movement', connecting: 'Connecting…', updated: 'Updated ',
    offline: 'Cannot reach the mind', empty: 'Nothing heard yet. Say something!',
    sent: 'Got it. Thinking…', failed: 'Could not send', unreachable: 'Cannot reach Sesame’s brain (the PC)',
    wait: s => `Just a moment (${s} s)`, done: 'Sesame has talked a lot today and is resting. See you tomorrow!',
    https: 'Open the https address to use your voice. Typing works here.',
    nosr: 'This browser cannot listen to speech. Please type instead.',
    allow: 'Please allow the microphone', misheard: e => `Didn’t catch that (${e})`, hearing: 'Listening…',
    q: t => '“' + t + '”', noise: '(a sound)', reflex: 'Reflex', design: 'Choreography', motion: 'Movement',
    candidates: 'choices', strength: 'size', speed: 'speed', addressed: 'addressed', why: 'Why',
    none: 'Does nothing', made: 'Made a new movement', stock: 'Built-in movement', reuse: 'Replays a learned movement',
    nochart: 'Built into the robot (no chart)', table: 'Show numbers', keyend: 'Key ends', ease: 'Ease',
    chart: 'Movement over time', src: {chat: 'chat', voice: 'voice', radio: 'radio', sound: 'sound'},
    EASE: {linear: 'steady', in: 'wind-up', out: 'settle', inout: 'smooth'},
    AXIS: {surge: 'sweep', spread: 'spread', yaw: 'twist', stride: 'stride', height: 'height', pitch: 'nose up', roll: 'tilt', lift: 'paw lift'},
  },
}[LANG];
document.getElementById('root').lang = LANG;
document.title = STR.title;
document.querySelectorAll('[data-t]').forEach(el => el.textContent = STR[el.dataset.t]);
document.querySelectorAll('[data-t-placeholder]').forEach(el => el.placeholder = STR[el.dataset.tPlaceholder]);
document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', STR[el.dataset.tAria]));
document.getElementById('other').textContent = STR.other;
document.getElementById('other').href = '?lang=' + (LANG === 'ja' ? 'en' : 'ja');
document.getElementById('live').textContent = STR.connecting;
document.getElementById('list').innerHTML = `<p class="empty">${STR.empty}</p>`;
document.documentElement.style.setProperty('--why', `"${STR.why}　"`);

// Units of the motion-space axes (manifest/motion_space.yaml); joints are in degrees.
const UNIT = {surge: '°', spread: '°', yaw: '°', stride: '°', height: 'mm', pitch: '°', roll: '°', lift: 'mm'};
const EASE = STR.EASE;
const label = n => STR.AXIS[n] || n, unit = n => UNIT[n] || '°';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toString();

function kindOf(e) {
  if (e.did === 'none' || !e.did) return ['none', STR.none, 'var(--none)'];
  if (e.design) return ['new', STR.made, 'var(--new)'];
  if (e.motion && e.motion.kind === 'firmware') return ['stock', STR.stock, 'var(--none)'];
  return ['reuse', STR.reuse, 'var(--reuse)'];
}

// Small multiples: one row per axis on a shared time scale; each row has its own scale and
// unit, so mixed units never share a y-axis. Key ends are hairlines labelled with their ease.
function chart(c, id) {
  const names = Object.keys(c.series), W = 680, L = 128, R = 12, top = 20, H = 46, gap = 10;
  const T = c.t[c.t.length - 1] || 1, x = t => L + (W - L - R) * t / T;
  const height = top + names.length * (H + gap) + 18;
  let svg = `<svg viewBox="0 0 ${W} ${height}" role="img" aria-label="${STR.chart}">`;
  let start = 0;
  for (const k of c.keys) {  // ease labels centred on each key's span
    const mid = x((start + k.t) / 2);
    svg += `<text x="${mid}" y="12" text-anchor="middle">${EASE[k.ease] || k.ease}</text>`;
    svg += `<line x1="${x(k.t)}" x2="${x(k.t)}" y1="16" y2="${height - 18}" stroke="var(--grid)" stroke-width="1"/>`;
    start = k.t;
  }
  names.forEach((n, i) => {
    const v = c.series[n], y0 = top + i * (H + gap);
    let lo = Math.min(0, ...v), hi = Math.max(0, ...v);
    if (hi - lo < 1e-6) { lo -= 1; hi += 1 }
    const y = val => y0 + H - (val - lo) / (hi - lo) * H;
    svg += `<text class="rowname" x="0" y="${y0 + H / 2 - 2}">${esc(label(n))}</text>`;
    svg += `<text x="0" y="${y0 + H / 2 + 13}">${esc(n)} ${unit(n)}</text>`;
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
    svg += `<text x="${L - 6}" y="${y0 + 9}" text-anchor="end">${fmt(hi)}</text>`;
    svg += `<text x="${L - 6}" y="${y0 + H}" text-anchor="end">${fmt(lo)}</text>`;
    const pts = v.map((val, j) => `${x(c.t[j]).toFixed(1)},${y(val).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg += `<circle class="dot" data-row="${i}" r="4" cx="0" cy="0" visibility="hidden" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>`;
  });
  svg += `<text x="${L}" y="${height - 2}">0 s</text><text x="${W - R}" y="${height - 2}" text-anchor="end">${fmt(T, 2)} s</text>`;
  svg += `<line class="cross" visibility="hidden" x1="0" x2="0" y1="16" y2="${height - 18}" stroke="var(--axis)" stroke-width="1"/>`;
  svg += `<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${height}" fill="transparent"/></svg>`;
  const rows = c.keys.map(k => {  // the table view: values where each key ends
    const j = c.t.findIndex(t => t >= k.t - 1e-9);
    return `<tr><td>${fmt(k.t, 2)} s</td><td>${EASE[k.ease] || k.ease}</td>${names.map(n => `<td>${fmt(c.series[n][j < 0 ? c.t.length - 1 : j])}</td>`).join('')}</tr>`;
  }).join('');
  const table = rows ? `<details class="table"><summary>${STR.table}</summary><table><tr><th>${STR.keyend}</th><th>${STR.ease}</th>${names.map(n => `<th>${esc(label(n))}</th>`).join('')}</tr>${rows}</table></details>` : '';
  return `<div class="chart" id="${id}">${svg}<div class="tip"></div></div>${table}`;
}

function hover(el, c) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), names = Object.keys(c.series);
  const W = 680, L = 128, R = 12, top = 20, H = 46, gap = 10, T = c.t[c.t.length - 1] || 1;
  const dots = [...svg.querySelectorAll('.dot')], cross = svg.querySelector('.cross');
  const move = ev => {
    const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    const j = Math.max(0, Math.min(c.t.length - 1, Math.round((q.x - L) / (W - L - R) * (c.t.length - 1))));
    const cx = L + (W - L - R) * c.t[j] / T;
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    names.forEach((n, i) => {
      const v = c.series[n], y0 = top + i * (H + gap);
      let lo = Math.min(0, ...v), hi = Math.max(0, ...v); if (hi - lo < 1e-6) { lo -= 1; hi += 1 }
      dots[i].setAttribute('cx', cx); dots[i].setAttribute('cy', y0 + H - (v[j] - lo) / (hi - lo) * H);
      dots[i].setAttribute('visibility', 'visible');
    });
    tip.innerHTML = `<div class="t">${fmt(c.t[j], 2)} s</div>` + names.map(n => `${esc(label(n))} <b>${fmt(c.series[n][j])}</b> ${unit(n)}`).join('<br>');
    const box = el.getBoundingClientRect(), left = (cx / W) * box.width;
    tip.style.display = 'block';
    tip.style.left = Math.min(box.width - tip.offsetWidth, left + 12) + 'px'; tip.style.top = '18px';
  };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; [cross, ...dots].forEach(d => d.setAttribute('visibility', 'hidden')) });
}

function card(e, i) {
  const [k, said, color] = kindOf(e), time = new Date(e.t * 1000).toLocaleTimeString();
  const tempo = e.tempo && e.tempo !== 1 ? ` · ${STR.speed} ×${fmt(e.tempo)}` : '';
  const addressed = e.addressed != null ? ` · ${STR.addressed} ${Math.round(e.addressed * 100)}%` : '';
  const offered = e.considered ? ` · ${STR.candidates} ${e.considered}` : '';
  let html = `<article class="card"><div class="heard"><span class="time">${time}</span>
    <span class="text">${e.text ? STR.q(esc(e.text)) : STR.noise}</span><span class="src">${STR.src[e.source] || esc(e.source)}</span></div>
    <div class="steps"><div class="step ${k}"><div class="label"><b>${STR.reflex}</b> ${esc(e.by)} · ${fmt(e.reflex_ms / 1000)} s${offered}</div>
    <div class="choice"><span class="chip"><i style="background:${color}"></i>${said}</span>
    <span class="meta">${STR.strength} ${fmt(e.intensity, 2)}${tempo}${addressed}</span></div>
    ${e.why ? `<div class="why">${esc(e.why)}</div>` : ''}${e.note && !e.design ? `<div class="err">${esc(e.note)}</div>` : ''}</div>`;
  if (e.design) html += `<div class="step new"><div class="label"><b>${STR.design}</b> ${esc(e.design.by)} · ${fmt(e.design.ms / 1000)} s</div>
    ${e.design.why ? `<div class="why">${esc(e.design.why)}</div>` : ''}</div>`;
  if (e.motion) {
    html += `<div class="step ${k}"><div class="label"><b>${STR.motion}</b></div><div><span class="about">${esc(e.motion.about)}</span><span class="name">${esc(e.motion.name)}</span></div>`;
    html += e.motion.curve ? chart(e.motion.curve, 'c' + i) : `<div class="meta">${STR.nochart}</div>`;
    html += `</div>`;
  }
  return html + `</div></article>`;
}

let shown = '';
async function refresh() {
  try {
    const list = await (await fetch('trace', {signal: AbortSignal.timeout(4000)})).json();
    document.getElementById('live').textContent = STR.updated + new Date().toLocaleTimeString();
    const key = list.length + ':' + (list.length ? list[list.length - 1].t : 0);
    if (key === shown) return;
    shown = key;
    const items = list.slice().reverse();
    const main = document.getElementById('list');
    main.innerHTML = items.length ? items.map(card).join('') : `<p class="empty">${STR.empty}</p>`;
    items.forEach((e, i) => { if (e.motion && e.motion.curve) hover(document.getElementById('c' + i), e.motion.curve) });
  } catch (err) {
    document.getElementById('live').textContent = STR.offline;
  }
}
refresh(); setInterval(refresh, 2000);

// Talking: the browser's speech recognition (needs HTTPS or localhost) turns speech into
// text; the text goes to the mind like a chat line. Typing works everywhere.
const $ = id => document.getElementById(id);
const now = $('now'), hint = $('hint'), mic = $('mic'), keep = $('keep');
async function send(text) {
  text = text.trim(); if (!text) return;
  now.textContent = STR.q(text);
  try {
    const r = await fetch('say', {method: 'POST', body: text, signal: AbortSignal.timeout(5000)});
    if (r.status === 429) {
      const j = await r.json();
      hint.textContent = j.done_for_today ? STR.done : STR.wait(Math.ceil(j.wait_s));
      return;
    }
    hint.textContent = r.ok ? STR.sent : STR.failed;
    shown = ''; setTimeout(refresh, 1500); setTimeout(refresh, 4000);
  } catch (e) { hint.textContent = STR.unreachable }
}
$('say').onsubmit = e => { e.preventDefault(); send($('text').value); $('text').value = '' };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR || !window.isSecureContext) {
  mic.hidden = true; keep.parentElement.hidden = true;
  hint.textContent = SR ? STR.https : STR.nosr;
}
function listen() {
  rec = new SR(); rec.lang = LANG === 'ja' ? 'ja-JP' : 'en-US'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    const r = e.results[e.results.length - 1], t = r[0].transcript;
    now.textContent = STR.q(t);
    if (r.isFinal) send(t);
  };
  rec.onerror = e => { hint.textContent = e.error === 'not-allowed' ? STR.allow : STR.misheard(e.error) };
  rec.onend = () => { listening = false; draw(); if (keep.checked) setTimeout(() => { if (keep.checked && !listening) start() }, 400) };
  rec.start(); listening = true; draw(); hint.textContent = STR.hearing;
}
function start() { try { listen() } catch (e) { listening = false; draw() } }
function draw() { mic.classList.toggle('on', listening); mic.textContent = listening ? STR.listening : STR.mic }
draw();
mic.onclick = () => { if (listening) { keep.checked = false; rec.stop() } else start() };
keep.onchange = () => { if (keep.checked && !listening) start() };
</script>
</body>
</html>
