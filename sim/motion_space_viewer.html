<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="Sesame's motion space">セサミの動作空間</title>
<!-- Generated by `python -m sim.motion_space --html` from sim/motion_space_viewer.html,
     sim/motion_space.js and manifest/motion_space.yaml. Self-contained: no network. -->
<style>
:root{--bg:#11151c;--panel:#1a2029;--line:#2c3440;--ink:#e8ecf2;--dim:#9aa5b5;--ok:#4cc38a;--bad:#ff5d5d;--acc:#8ab4ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
body.site header{padding-right:150px}
h1{font-size:22px;margin:0}header .sub{color:var(--dim)}header .sp{flex:1}
#badge{padding:3px 12px;border-radius:99px;font-weight:700;background:#24443a;color:var(--ok)}#badge.bad{background:#4a2326;color:var(--bad)}#badge.mid{background:#2f3a26;color:#b5e07a}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:12px;padding:12px;height:calc(100% - 52px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0}
#left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-height:0}
#right{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;min-height:0;overflow:auto}
#stories{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#27303c;border:1px solid #384252;border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#313c4b}button.on{background:#2e4a7a;border-color:var(--acc)}
#story{color:var(--ink);margin-top:8px;min-height:3em}#story b{color:var(--acc)}
#viewwrap{position:relative;padding:0;overflow:hidden}
#view{width:100%;height:100%;display:block;cursor:grab;touch-action:none}#view:active{cursor:grabbing}
#metrics{position:absolute;left:12px;top:10px;font-size:13px;line-height:1.7;background:rgba(17,21,28,.75);padding:6px 10px;border-radius:8px}
#metrics .k{color:var(--dim)}.okv{color:var(--ok)}.badv{color:var(--bad)}
#hint{position:absolute;right:12px;bottom:8px;color:var(--dim);font-size:12px}
#fw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font:12px ui-monospace,Menlo,monospace;text-align:center}
#fw div{background:#202733;border-radius:6px;padding:3px 0}#fw b{display:block;font-size:15px;color:var(--ink)}
.grid{stroke:#2c3542;stroke-width:1;fill:none}.support{fill:rgba(76,195,138,.18);stroke:var(--ok);stroke-width:2}
.paw{fill:var(--ok)}.pawup{fill:#ffb347}.face{stroke:rgba(0,0,0,.35);stroke-width:.6;stroke-linejoin:round}
.comline{stroke:#fff;stroke-dasharray:3 3;opacity:.8}.com{fill:var(--ok);stroke:#fff;stroke-width:1.5}.combad{fill:var(--bad);stroke:#fff;stroke-width:1.5}
.fwd{stroke:var(--acc);stroke-width:3}
#mapbox{display:grid;grid-template-columns:minmax(160px,300px) minmax(150px,1fr);gap:12px;align-items:start}
#map{width:100%;aspect-ratio:1;border-radius:8px;cursor:crosshair;image-rendering:pixelated;background:#000}
#mapside{font-size:13px;line-height:1.4}#legend{margin-top:6px;font-size:12.5px}#mapside select{font:inherit;background:#27303c;color:var(--ink);border:1px solid #384252;border-radius:6px;padding:2px 4px}
.lg{display:flex;align-items:center;gap:6px;margin:3px 0}.lg i{flex:0 0 14px;height:14px;border-radius:3px}
.row{display:grid;grid-template-columns:118px 1fr 64px;align-items:center;gap:8px;margin:2px 0}
.row label{cursor:pointer;line-height:1.15}.row label small{display:block;color:var(--dim);font-size:11px}
.row output{font:13px ui-monospace,Menlo,monospace;text-align:right}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.grp{color:var(--dim);font-size:12px;margin:6px 0 2px;letter-spacing:.05em}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#robot{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}#robot .off{background:#7a2026}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:min(900px,92vw)}
dialog pre{white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace;max-height:70vh;overflow:auto}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#viewwrap{height:60vh}}
</style>
<header translate="no"><h1 data-t="title"></h1><span class="sub" data-t="sub"></span><span class="sp"></span>
<span id="badge"></span><button id="llm" data-t="llm"></button><button id="langbtn" hidden></button></header>
<main translate="no">
<section id="left">
 <div class="card"><div id="stories"></div><div id="story"></div></div>
 <div class="card" id="viewwrap"><svg id="view" viewBox="-300 -230 600 400"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
  markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8ab4ff"/></marker></defs><g id="scene"></g></svg>
  <div id="metrics"></div><div id="hint" data-t="hint"></div></div>
 <div class="card"><div id="fw"></div></div>
</section>
<section id="right">
 <div class="card" id="mapbox"><canvas id="map" width="64" height="64"></canvas><div id="mapside">
  <div><span data-t="mx"></span> <select id="mx"></select></div><div><span data-t="my"></span> <select id="my"></select></div>
  <div style="margin:6px 0 0;color:var(--dim)" data-t="mapnote"></div><div id="legend"></div></div></div>
 <div class="card"><div class="btns" style="margin:0">
  <button data-g="fwd" data-t="fwd"></button><button data-g="back" data-t="back"></button><button data-g="left" data-t="left"></button>
  <button data-g="right" data-t="right"></button><button data-g="stomp" data-t="stomp"></button><button id="stop" data-t="stop"></button>
  <button id="home" data-t="home"></button><label style="align-self:center"><input type="checkbox" id="proj" checked> <span data-t="proj"></span></label></div>
  <div id="robot"><label><input type="checkbox" id="live"> <span data-t="live"></span></label>
  <button id="freeze">Freeze</button><button id="roff" class="off">OUTPUTS OFF</button><span id="rst" style="color:var(--dim);margin-left:6px"></span></div></div>
 <div class="card" id="sliders"></div>
</section>
</main>
<dialog id="dlg" translate="no"><p data-t="llmnote" style="color:var(--dim);margin:0 0 6px"></p><pre id="txt"></pre>
<div class="btns"><button id="copy" data-t="copy"></button><button onclick="dlg.close()" data-t="close"></button></div></dialog>
<script>
/*CORE*/
const D = /*DATA*/;
const S = makeSpace(D), AX = D.axes, SP = D.space, C = SP.center, $ = q => document.querySelector(q);
// ---- language: follows the site's toggle (site-lang / langchange) where it exists, else its own button
const TX = {
 ja: {title: "セサミの動作空間", sub: "8個のサーボ → 意味のある8本の軸", llm: "LLMに渡すテキスト", lang: "EN",
  hint: "ドラッグで回転・ホイールで拡大　｜　MuJoCo シミュレーション由来（実機は未検証）", mx: "横", my: "縦",
  mapnote: "他の軸は今の値のまま<br>2軸だけ動かした断面<br>クリックで移動", fwd: "▲ 前進", back: "▼ 後退", left: "⟲ 左旋回",
  right: "⟳ 右旋回", stomp: "足踏み", stop: "■ 停止", home: "中心へ", proj: "範囲外は縮める", live: "実機に送る（このロボット）",
  copy: "コピー", close: "閉じる", llmnote: "Sesame Mind の振付 LLM が読む説明文（日本語）。", gripHip: "脚の振り（hip 4本の組み合わせ・度）",
  gripBody: "胴体の姿勢（足は逆運動学で床に着く）", slnote: "緑の帯 = その軸だけ動かしたときの可動域。軸名クリックで往復。",
  sweep: "クリックでこの軸だけ往復", okBudget: "立てる・予算内", ok: "立てる", shrunk: "範囲外 → 縮めて表示（{n}%）", bad: "立てない：",
  intro: "上のボタンで発見を順に説明できます。スライダー・地図クリック・軸名クリックでも動かせます。", neterr: "通信エラー"},
 en: {title: "Sesame's motion space", sub: "8 servos → 8 meaningful axes", llm: "Text for the LLM", lang: "日本語",
  hint: "Drag to orbit · scroll to zoom　|　From MuJoCo simulation (not yet verified on the robot)", mx: "x", my: "y",
  mapnote: "Other axes stay as they are:<br>a slice through two axes.<br>Click to move.", fwd: "▲ Forward", back: "▼ Back",
  left: "⟲ Turn left", right: "⟳ Turn right", stomp: "Step in place", stop: "■ Stop", home: "Centre", proj: "Shrink out-of-range poses",
  live: "Drive this robot", copy: "Copy", close: "Close", llmnote: "What Sesame Mind's choreographer LLM reads (in Japanese).",
  gripHip: "Leg sweep (patterns of the four hips, deg)", gripBody: "Body pose (feet solved to keep every paw down)",
  slnote: "Green band = the range of that axis on its own. Click an axis name to sweep it.", sweep: "Click to sweep this axis alone",
  okBudget: "Stands · in budget", ok: "Stands", shrunk: "Out of range → shown shrunk ({n}%)", bad: "Can't stand: ",
  intro: "Use the buttons above to walk through the findings. Sliders, map clicks and axis names move the robot too.", neterr: "Link error"},
};
const AXT = {ja: {surge:"前後シフト",spread:"開く／寄せる",yaw:"ひねり",stride:"対角の一歩",height:"高さ",pitch:"ピッチ",roll:"ロール",lift:"対角の持ち上げ"},
 en: {surge:"shift fore/aft",spread:"open / gather",yaw:"twist",stride:"diagonal step",height:"height",pitch:"nose up",roll:"right side up",lift:"diagonal lift"}};
const RULET = {ja: {support_margin_mm:"重心の余裕",clearance_mm:"胴の床クリアランス",foot_min_deg:"足の最小角度",hip_pair_sum_min_deg:"前後hipの和"},
 en: {support_margin_mm:"Centre-of-mass margin",clearance_mm:"Body floor clearance",foot_min_deg:"Lowest foot angle",hip_pair_sum_min_deg:"Front+back hip sum"}};
const RULE = {support_margin_mm:"mm",clearance_mm:"mm",foot_min_deg:"°",hip_pair_sum_min_deg:"°"};
const CLS = {budget:"#2ea05a",feasible:"#82d296",limit:"#50505a",support_margin_mm:"#e64646",foot_min_deg:"#f59632",
 clearance_mm:"#a05ac8",hip_pair_sum_min_deg:"#468cf0",unreachable:"#19191e",lift:"#787878"};
const CLST = {ja: {budget:"予算内（自由に組める）",feasible:"立てる",limit:"関節リミット",support_margin_mm:"重心が外→転倒",foot_min_deg:"足が寝すぎ",
  clearance_mm:"胴が床に当たる",hip_pair_sum_min_deg:"前後の脚が衝突",unreachable:"足が届かない",lift:"lift 過大"},
 en: {budget:"In budget (any mix)",feasible:"Stands",limit:"Joint limit",support_margin_mm:"CoM outside → tips",foot_min_deg:"Feet too flat",
  clearance_mm:"Body hits floor",hip_pair_sum_min_deg:"Legs collide",unreachable:"Paw can't reach",lift:"Lift too high"}};
const SITE = !!window.__i18n;  // injected by the presentation site
let LANG = (() => { try { const v = localStorage.getItem("site-lang"); if (v === "en" || v === "ja") return v; } catch (e) {}
  return SITE ? (document.documentElement.lang || "ja").slice(0, 2) : ((navigator.language || "").startsWith("ja") ? "ja" : "en"); })();
const t = k => TX[LANG][k];
const LEGC = {torso:[233,225,207],face:[45,75,220],leg0:[222,80,62],leg3:[222,80,62],leg1:[236,150,60],leg2:[236,150,60]};
const VIEW = {};
for (const a of AX) { const [lo, hi] = SP.ranges[a], p = 0.35 * (hi - lo); VIEW[a] = [+(lo - p).toFixed(1), +(hi + p).toFixed(1)]; }
let z = S.full({}), shown = z, anim = null, cam = {yaw: 32, elev: 26, scale: 2500}, floor = {a: 0, b: 0, yaw: 0};
let mapAx = ["surge", "stride"], mapCache = "", mapDirty = true, lastMap = 0;

// ---- sliders
const sl = {};
let html = "";
for (const a of AX) {
  if (a === "surge") html += '<div class="grp" data-t="gripHip"></div>';
  if (a === "height") html += '<div class="grp" data-t="gripBody"></div>';
  const unit = D.meaning[a][0] === "mm" ? "mm" : "°";
  html += `<div class="row"><label data-a="${a}">${a}<small id="j_${a}"></small></label>
    <input type="range" id="s_${a}" min="${VIEW[a][0]}" max="${VIEW[a][1]}" step="0.25" value="${C[a]}"><output id="o_${a}"></output></div>`;
}
$("#sliders").innerHTML = html + '<div style="color:var(--dim);font-size:12px;margin-top:6px" data-t="slnote"></div>';
for (const a of AX) {
  const el = sl[a] = $("#s_" + a), [lo, hi] = VIEW[a], [r0, r1] = SP.ranges[a];
  const pct = v => (100 * (v - lo) / (hi - lo)).toFixed(1) + "%";
  el.style.background = `linear-gradient(90deg,#3a3f48 ${pct(r0)},#2ea05a ${pct(r0)},#2ea05a ${pct(r1)},#3a3f48 ${pct(r1)})`;
  el.addEventListener("input", () => { anim = null; z[a] = +el.value; markStory(null); update(); });
}
document.querySelectorAll(".row label").forEach(l => l.onclick = () => { markStory(null); sweep(l.dataset.a); });

// ---- map
const mapC = $("#map"), mctx = mapC.getContext("2d"), N = 64;
for (const id of ["#mx", "#my"]) $(id).innerHTML = AX.map(a => `<option>${a}</option>`).join("");
$("#mx").value = mapAx[0]; $("#my").value = mapAx[1];
$("#mx").onchange = e => { mapAx[0] = e.target.value; mapDirty = true; update(); };
$("#my").onchange = e => { mapAx[1] = e.target.value; mapDirty = true; update(); };

const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mapImg = mctx.createImageData(N, N);
function drawMap(force) {
  const [ax, ay] = mapAx, key = AX.filter(a => a !== ax && a !== ay).map(a => (a === "lift" ? Math.round(z[a] / 4) : z[a].toFixed(1))).join();
  if (force || mapDirty || (key !== mapCache && performance.now() - lastMap > 250)) {
    const cls = S.slice(z, ax, ay, N, VIEW[ax], VIEW[ay]);
    cls.forEach((k, i) => { const c = hex(CLS[k]); mapImg.data.set([c[0], c[1], c[2], 255], i * 4); });
    mapCache = key; mapDirty = false; lastMap = performance.now();
  }
  mctx.putImageData(mapImg, 0, 0);
  const px = (a, v) => (v - VIEW[a][0]) / (VIEW[a][1] - VIEW[a][0]) * N;
  const dot = (p, r, col, fill) => { mctx.beginPath(); mctx.arc(px(ax, p[ax]), N - px(ay, p[ay]), r, 0, 7);
    mctx.lineWidth = 0.6; mctx.strokeStyle = col; fill ? (mctx.fillStyle = col, mctx.fill()) : mctx.stroke(); };
  if (shown !== z && (shown[ax] !== z[ax] || shown[ay] !== z[ay])) {
    mctx.beginPath(); mctx.moveTo(px(ax, z[ax]), N - px(ay, z[ay])); mctx.lineTo(px(ax, shown[ax]), N - px(ay, shown[ay]));
    mctx.strokeStyle = "#fff"; mctx.lineWidth = 0.4; mctx.stroke(); dot(z, 1.6, "#fff", false);
  }
  dot(shown, 1.4, "#fff", true);
}
function mapPick(e) {
  const r = mapC.getBoundingClientRect(), [ax, ay] = mapAx;
  const fx = (e.clientX - r.left) / r.width, fy = 1 - (e.clientY - r.top) / r.height;
  anim = null; markStory(null);
  z[ax] = +(VIEW[ax][0] + fx * (VIEW[ax][1] - VIEW[ax][0])).toFixed(2);
  z[ay] = +(VIEW[ay][0] + fy * (VIEW[ay][1] - VIEW[ay][0])).toFixed(2); update();
}
mapC.addEventListener("pointerdown", e => { mapPick(e); mapC.setPointerCapture(e.pointerId); });
mapC.addEventListener("pointermove", e => { if (e.buttons) mapPick(e); });

// ---- 3-D view
const view = $("#view");
view.addEventListener("pointermove", e => { if (!e.buttons) return;
  cam.yaw -= e.movementX * 0.4; cam.elev = Math.max(5, Math.min(85, cam.elev + e.movementY * 0.3)); draw(); });
view.addEventListener("wheel", e => { e.preventDefault(); cam.scale = Math.max(900, Math.min(6000, cam.scale * Math.exp(-e.deltaY * 0.001))); draw(); }, {passive: false});

function draw() {
  const sc = S.scene(shown);
  if (!sc) return;
  const m = S.measures(shown);
  $("#scene").innerHTML = S.svgScene(sc, cam, {colors: LEGC, floor, comOk: m && m.support_margin_mm >= SP.rules.support_margin_mm});
}
function update() {
  const raw = S.violations(z), projOn = $("#proj").checked;
  shown = raw.length && projOn ? S.project(z) : z;
  if (!S.decode(shown)) shown = S.project(z);
  for (const a of AX) { sl[a].value = z[a]; $("#o_" + a).textContent = (+z[a]).toFixed(1); }
  const v = S.violations(shown), m = S.measures(shown), b = $("#badge");
  if (!raw.length) { b.className = S.withinBudget(z) ? "" : "mid"; b.textContent = t(S.withinBudget(z) ? "okBudget" : "ok"); }
  else if (shown !== z) { b.className = "mid"; b.textContent = t("shrunk").replace("{n}", Math.round(100 * scaleOf())); }
  else { b.className = "bad"; b.textContent = t("bad") + [...new Set(raw.map(k => CLST[LANG][k] || CLST[LANG][k.split(" ")[0]] || k))].join(" · "); }
  $("#metrics").innerHTML = m ? Object.entries(RULE).map(([k, u]) => { const ok = m[k] >= SP.rules[k];
    return `<div><span class="k">${RULET[LANG][k]}</span> <b class="${ok ? "okv" : "badv"}">${m[k].toFixed(1)}${u}</b> <span class="k">≥ ${SP.rules[k]}${u}</span></div>`; }).join("") : "";
  const q = S.decode(shown).q, fw = S.firmware(q);
  $("#fw").innerHTML = D.joints.map((j, i) => `<div>${j.name}<b>${fw[i].toFixed(0)}°</b></div>`).join("");
  draw(); drawMap(false); robotSend(fw);
}
function scaleOf() {
  let s = 1;
  for (const a of AX) if (Math.abs(z[a] - C[a]) > 1e-6) s = Math.min(s, (shown[a] - C[a]) / (z[a] - C[a]));
  return Math.max(0, s);
}

// ---- animations
const GAITS = {fwd: [15, 0, 10], back: [-15, 0, 10], left: [0, 12, 10], right: [0, -12, 10], stomp: [0, 0, 10]};
const HZ = 1.5;
function gait(name) { anim = {kind: "gait", p: GAITS[name], t0: performance.now(), base: Object.assign({}, z, {stride: 0, spread: 0, lift: 0})};
  document.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("on", b.dataset.g === name)); }
function sweep(a, amp) { const [r0, r1] = SP.ranges[a];
  anim = {kind: "sweep", a, t0: performance.now(), base: Object.assign({}, z), amp: amp || Math.max(Math.abs(r0 - C[a]), Math.abs(r1 - C[a])) * 1.25}; }
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (anim) {
    const t = (now - anim.t0) / 1000;
    if (anim.kind === "gait") {
      const [st, sp, li] = anim.p;
      z = S.gait(t, HZ, st, sp, li, anim.base);
      const v = SP.gait.forward_mm_s_per_deg_hz * st * HZ / 1000, w = SP.gait.turn_deg_s_per_deg_hz * sp * HZ * Math.PI / 180;
      floor.yaw += w * dt; floor.a += Math.cos(floor.yaw) * v * dt; floor.b += Math.sin(floor.yaw) * v * dt;
    } else if (anim.kind === "sweep") {
      z = Object.assign({}, anim.base); z[anim.a] = C[anim.a] + anim.amp * Math.sin(2 * Math.PI * t / 3);
    } else if (anim.kind === "path") {
      z = anim.f(t, anim.base);
    }
    update();
  }
  requestAnimationFrame(tick);
}
document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { markStory(null); gait(b.dataset.g); });
$("#stop").onclick = () => { anim = null; z = Object.assign({}, z, {stride: 0, spread: 0, lift: 0}); stopMarks(); update(); };
$("#home").onclick = () => { anim = null; z = S.full({}); floor = {a: 0, b: 0, yaw: 0}; stopMarks(); markStory(null); update(); };
$("#proj").onchange = update;
function stopMarks() { document.querySelectorAll("[data-g]").forEach(b => b.classList.remove("on")); }

// ---- stories for the talk
const g = SP.gait, bud = SP.budget;
const tiltMax = Math.max(...Object.values(SP.tilt_by_height)), reach = SP.ranges.height[1];
const path = f => () => { anim = {kind: "path", t0: performance.now(), base: S.full({}), f}; };
const STORIES = [  // [title {ja,en}, map axes, text {ja,en}, action]
 [{ja: "① 8軸に言い換える", en: "① Eight named axes"}, ["surge", "stride"],
  {ja: `8個のサーボを一様ランダムに動かすと、立てる姿勢は<b>約1割</b>。脚の振り4軸（surge・spread・yaw・stride）と、足先を床に着けたままの胴体姿勢（height・pitch・roll）、歩行用の lift の<b>8本の意味ある軸</b>に言い換える。`,
   en: `Random servo angles stand only <b>about 1 time in 10</b>. Re-express them as four leg-sweep axes (surge, spread, yaw, stride), a body pose that keeps every paw down (height, pitch, roll) and a gait lift: <b>eight axes that mean something</b>.`},
  path((t, b) => { const k = Math.floor(t / 2.4) % AX.length, a = AX[k], [r0, r1] = SP.ranges[a];
    const o = Object.assign({}, b); o[a] = C[a] + 0.8 * Math.max(r1 - C[a], C[a] - r0) * Math.sin(Math.PI * (t % 2.4) / 1.2); if (a === "lift") o[a] *= 0.8; return o; })],
 [{ja: `② hip は ${bud.hip_l1_deg}° を分け合う`, en: `② The hips share ${bud.hip_l1_deg}°`}, ["surge", "stride"],
  {ja: `4本の hip サーボには4軸の<b>合計</b>がかかる。|surge|+|spread|+|yaw|+|stride| ≤ <b>${bud.hip_l1_deg}°</b> のひし形の中なら、どう組み合わせても立てる。外は関節リミット。`,
   en: `Every hip servo feels the <b>sum</b> of the four hip axes. Inside the diamond |surge|+|spread|+|yaw|+|stride| ≤ <b>${bud.hip_l1_deg}°</b> any mix stands; outside it are the joint limits.`},
  path((t, b) => Object.assign({}, b, {surge: 52 * Math.cos(t * 1.3), stride: 52 * Math.sin(t * 1.3)}))],
 [{ja: "③ 重心と脚の衝突", en: "③ Balance and collisions"}, ["surge", "spread"],
  {ja: `足先を全部前に寄せると重心が支持多角形（緑）の外に出て<b>倒れる</b>（赤）。前脚と後脚を両方内側に振ると、同じ側の脚が<b>ぶつかる</b>（青）。`,
   en: `Sweep every paw forward and the centre of mass leaves the support polygon (green): it <b>tips over</b> (red). Swing front and back legs inward together and the legs on one side <b>collide</b> (blue).`},
  path((t, b) => Object.assign({}, b, {surge: 50 * Math.sin(t * 1.1), spread: -22 - 20 * Math.cos(t * 1.1)}))],
 [{ja: "④ 脚が短い", en: "④ Short legs"}, ["height", "pitch"],
  {ja: `足先が届く深さは約 ${reach} mm。傾けられるのは高さ 42〜44 mm で <b>±${tiltMax}°</b> 程度。低いと足が寝てサーボが負け（橙）、高いと足が届かない（黒）。`,
   en: `The paws reach only about ${reach} mm down, so the body tilts just <b>±${tiltMax}°</b>, best at 42–44 mm. Lower, the paddles lie flat and the servos give (orange); higher, the paws can't reach (black).`},
  path((t, b) => Object.assign({}, b, {height: 42 + 7 * Math.sin(t * 0.7), pitch: 8 * Math.sin(t * 2.1)}))],
 [{ja: "⑤ 歩く", en: "⑤ Walking"}, ["stride", "spread"],
  {ja: `stride を振りながら lift を <b>1/4 周期先</b>に振る（対角トロット）。前進 ≈ <b>${g.forward_mm_s_per_deg_hz}×振幅×hz</b> mm/s、lift の位相を逆にすると後退。`,
   en: `Oscillate stride and lead it with lift by <b>a quarter cycle</b> (a diagonal trot). Forward ≈ <b>${g.forward_mm_s_per_deg_hz} × amplitude × hz</b> mm/s; flip the lift phase to walk back.`},
  () => gait("fwd")],
 [{ja: "⑥ 曲がる", en: "⑥ Turning"}, ["stride", "spread"],
  {ja: `yaw を振っても曲がらない。<b>spread</b> を振ると対角ペアが逆向きにひねり、旋回 ≈ <b>${g.turn_deg_s_per_deg_hz}×振幅×hz</b> °/s。stride と混ぜると弧を描く。`,
   en: `Oscillating yaw doesn't turn. Oscillate <b>spread</b>: the diagonals twist opposite ways, turning ≈ <b>${g.turn_deg_s_per_deg_hz} × amplitude × hz</b> °/s. Mix in stride to walk an arc.`},
  () => gait("left")],
];
let story = null;
function markStory(i) { story = i; document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", +b.dataset.s === i)); if (i === null) return;
  const [, axes, , act] = STORIES[i]; storyText(); mapAx = axes.slice(); $("#mx").value = axes[0]; $("#my").value = axes[1];
  mapDirty = true; stopMarks(); floor = {a: 0, b: 0, yaw: 0}; z = S.full({}); act(); }
function storyText() { $("#story").innerHTML = story === null ? t("intro") : STORIES[story][2][LANG]; }

// ---- apply the language to everything static
function applyLang(lang) {
  LANG = lang === "en" ? "en" : "ja";
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t(e.dataset.t); });
  for (const a of AX) { $("#j_" + a).textContent = AXT[LANG][a]; document.querySelector(`label[data-a="${a}"]`).title = t("sweep"); }
  $("#legend").innerHTML = Object.keys(CLS).map(k => `<div class="lg"><i style="background:${CLS[k]}"></i>${CLST[LANG][k]}</div>`).join("");
  $("#stories").innerHTML = STORIES.map((s, i) => `<button data-s="${i}" class="${i === story ? "on" : ""}">${s[0][LANG]}</button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => markStory(+b.dataset.s));
  $("#langbtn").textContent = t("lang"); storyText(); update();
}
document.addEventListener("langchange", e => applyLang(e.detail && e.detail.lang));
if (SITE) document.body.classList.add("site");
else { $("#langbtn").hidden = false; $("#langbtn").onclick = () => applyLang(LANG === "ja" ? "en" : "ja"); }

// ---- LLM text
$("#llm").onclick = () => { $("#txt").textContent = D.text; $("#dlg").showModal(); };
$("#copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(D.text);

// ---- the real robot, only when this page is served by Sesame itself (/space on the S3)
let robotOk = false, busy = false, lastSent = "", lastAt = 0;
async function rcmd(c) { const r = await fetch("/cmd?c=" + encodeURIComponent(c), {signal: AbortSignal.timeout(1500)}); return r.text(); }
async function robotSend(fw) {
  if (!robotOk || !$("#live").checked || busy) return;
  const line = "pose " + fw.map(v => v.toFixed(1)).join(" "), now = performance.now();
  if (line === lastSent ? now - lastAt < 200 : now - lastAt < 100) return;
  busy = true; lastAt = now;
  try { const t = await rcmd(line === lastSent ? "heartbeat" : line); lastSent = line; $("#rst").textContent = t.split("\n")[0].slice(0, 40); }
  catch (e) { $("#rst").textContent = t("neterr"); } finally { busy = false; }
}
setInterval(() => { if (robotOk && $("#live").checked && !document.hidden) robotSend(S.firmware(S.decode(shown).q)); }, 200);
$("#live").onchange = async e => { if (e.target.checked) { try { $("#rst").textContent = await rcmd("arm run"); } catch (x) {} lastSent = ""; update(); } };
$("#freeze").onclick = () => { $("#live").checked = false; rcmd("stop").then(t => $("#rst").textContent = t); };
$("#roff").onclick = () => { $("#live").checked = false; rcmd("off").then(t => $("#rst").textContent = t); };
if (location.protocol === "http:") fetch("/status", {signal: AbortSignal.timeout(1500)}).then(r => r.text())
  .then(t => { if (/\bmode=\d/.test(t)) { robotOk = true; $("#robot").style.display = "block"; } }).catch(() => {});

applyLang(LANG); requestAnimationFrame(tick);
</script></html>
